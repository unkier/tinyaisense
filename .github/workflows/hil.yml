# HIL tier: the real Atom Echo, on the hub PC's self-hosted runner, over its serial console and
# the LAN. The Interrupt gate on injected presses, and the soak, on the debug build, flashed only
# if the build changed. The rig: ~/.config/tinyaisense/hil.toml (see the README). Each run's
# acceptance report goes to the `acceptance` branch, and into the run's summary.
name: HIL

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Which tests, as pytest's -k takes them: e.g. interrupt or soak (default: all)"
        default: ""
      soak_minutes:
        description: How long the soak runs, in minutes
        default: "60"

permissions:
  contents: read

# One job at a time on the one hub PC, the bench or the HIL tier: another would load it.
concurrency:
  group: hub-pc
  cancel-in-progress: false

jobs:
  hil:
    name: interrupt, soak on the Echo
    runs-on: [self-hosted, tinyaisense-hub]
    timeout-minutes: 150
    permissions:
      contents: write # the report, to the acceptance branch
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --all-packages --no-default-groups --group test
      # Fails if 2 of 3 runs of the Interrupt gate miss, or if the soak breaks an invariant. The
      # report logs loadavg and the CPU governor.
      - name: HIL
        env:
          TESTS: ${{ inputs.tests }}
          TINYAISENSE_HIL_SOAK_MINUTES: ${{ inputs.soak_minutes }}
          TINYAISENSE_HIL_OUT: acceptance
        run: uv run --no-sync pytest -m hil packages/hil/tests/hil -v ${TESTS:+-k "$TESTS"}
      - uses: ./.github/actions/acceptance
        if: always()
        with:
          token: ${{ github.token }}
          missing: "No report: the HIL tier didn't get to the rig. See its log."
