# Fast tier: functional checks only, on every push. No timing asserts here.
name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: ruff + pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      # pyright needs the test deps too: it type-checks the tests. And the local speech
      # engines, which it type-checks against typings/.
      - run: uv sync --locked --all-packages --extra local
      - run: uv run --no-sync ruff check --output-format=github
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync pyright
      # wire, the SDK and the vector generator (loaded by wire's tests) must also
      # type-check against the 3.11 stdlib.
      - run: >-
          uv run --no-sync pyright --pythonversion 3.11
          packages/wire packages/sdk docs/protocol/vectors

  test:
    name: pytest (3.14, all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      # The local speech engines, without their models: their tests skip, bar the one that
      # the hub refuses to start without them.
      - run: uv sync --locked --all-packages --no-default-groups --group test --extra local
      - run: >-
          uv run --no-sync pytest --cov-report=term-missing
          --cov=tinyaisense_wire --cov=tinyaisense_hub --cov=tinyaisense_sim --cov=tinyaisense
      - name: Coverage summary
        run: uv run --no-sync coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  test-py311:
    name: pytest (3.11, wire + sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      # hub and sim pin the workspace lock to >=3.14, so wire and the SDK get
      # their own unlocked 3.11 environment.
      - run: uv venv --python 3.11
      - run: uv pip install -e packages/wire -e packages/sdk --group test
      - run: >-
          .venv/bin/pytest packages/wire packages/sdk --cov-report=term-missing
          --cov=tinyaisense_wire --cov=tinyaisense

  firmware:
    name: firmware (native tests, pio check, esp32 build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      # The toolchains, ESP-IDF and its Python env are large and change only with platformio.ini.
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: uv tool install platformio==6.2.0
      # The pure-C libraries under ASan and UBSan, with -Wall -Wextra -Werror.
      - run: pio test -e native
      # -Wall -Wextra -Werror on every tinyaisense component.
      - run: pio run -e m5stack-atom-echo
      # After the build: the esp32 check reads the generated IDF config.
      - run: >-
          pio check -e m5stack-atom-echo -e native
          --fail-on-defect=low --fail-on-defect=medium --fail-on-defect=high
