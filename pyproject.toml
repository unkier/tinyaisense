[tool.uv]
required-version = ">=0.10.0"

[tool.uv.workspace]
members = ["packages/*"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
test = [
    "openai-agents>=0.22",
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.4",
]
lint = ["pyright[nodejs]>=1.1.412", "ruff>=0.16"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.ruff]
line-length = 100
target-version = "py314"

# wire and the SDK must stay importable on 3.11.
[tool.ruff.per-file-target-version]
"packages/wire/**" = "py311"
"packages/sdk/**" = "py311"
"docs/**" = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT"]

[tool.pyright]
include = ["packages", "docs/protocol/vectors"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest]
minversion = "9.0"
testpaths = ["packages"]
addopts = ["--import-mode=importlib"]
strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # uvloop's run_in_executor, under asyncio.to_thread.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
# A hung asyncio test fails instead of stalling CI.
timeout = "60"

[tool.coverage.run]
branch = true
