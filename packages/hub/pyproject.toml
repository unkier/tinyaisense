[project]
name = "tinyaisense-hub"
version = "0.1.0"
description = "tinyaisense hub and owner CLI"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "starlette>=1.7",
    "tinyaisense-wire",
    "uvicorn>=0.54.0,<0.55",
    "uvloop>=0.22.1",
    "websockets>=17.1",
    "zeroconf>=0.151",
]

[project.scripts]
tinyaisense-hub = "tinyaisense_hub.cli:main"

[project.optional-dependencies]
# Local speech engines. Piper and torch (Silero RU only) come with the local TTS.
local = ["onnxruntime>=1.30", "sherpa-onnx>=1.13.8"]
# polza.ai cloud speech plugin.
polza = []

[tool.uv.sources]
tinyaisense-wire = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.0,<0.11"]
build-backend = "uv_build"
