[project]
name = "tinyaisense-hub"
version = "0.1.0"
description = "tinyaisense hub and owner CLI"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "soxr>=1.0",
    "starlette>=1.7",
    "tinyaisense-wire",
    "uvicorn>=0.54.0,<0.55",
    "uvloop>=0.22.1",
    "websockets>=17.1",
    "zeroconf>=0.151",
]

[project.scripts]
tinyaisense-hub = "tinyaisense_hub.cli:main"

[project.optional-dependencies]
# Local speech engines. torch runs Silero's Russian TTS only.
local = ["onnxruntime>=1.30", "piper-tts>=1.8", "sherpa-onnx>=1.13.8", "torch>=2.14"]
# polza.ai cloud speech plugin.
polza = []

[tool.uv.sources]
tinyaisense-wire = { workspace = true }
# PyPI's torch for Linux pulls in CUDA, GBs of it: the hub runs it on the CPU.
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["uv_build>=0.10.0,<0.11"]
build-backend = "uv_build"
