; tinyaisense firmware: ESP-IDF 5.5, C11 (GNU C11 where FreeRTOS headers need it). `idf.py build` works on the same tree.
;
;   Build:          pio run -e m5stack-atom-echo
;   Flash:          pio run -e m5stack-atom-echo -t upload --upload-port /dev/ttyUSB0
;   Debug build:    pio run -e m5stack-atom-echo-debug (the test hooks: `help` on the console)
;   Serial log:     pio device monitor -e m5stack-atom-echo
;   Native tests:   pio test -e native
;   Static checks:  pio check -e m5stack-atom-echo -e m5stack-atom-echo-debug -e native
;                   --fail-on-defect=low --fail-on-defect=medium --fail-on-defect=high
;                   (after the builds: it needs their IDF config)
;
; Two envs per Board, release and debug: the env's sdkconfig defaults pick the Board's Kconfig
; choice, and debug.defaults adds the test hooks.

[platformio]
src_dir = main
default_envs = m5stack-atom-echo

[env]
check_tool = cppcheck
; unusedFunction can't see calls across files, so it flags every public function.
check_flags = cppcheck: --enable=warning,style,performance,portability --inline-suppr
check_skip_packages = yes

[env:m5stack-atom-echo]
platform = espressif32@6.12.0
board = m5stack-atom
framework = espidf
board_build.partitions = partitions.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;boards/m5stack-atom-echo.defaults
monitor_speed = 115200
upload_speed = 115200
check_src_filters = +<main/*.c> +<components/*/*.c> +<components/*/*/*.c>

; The pure-C libraries on the PC, under ASan and UBSan. test_wire runs the golden vectors.
[env:native]
platform = native
test_framework = unity
lib_deps =
    symlink://components/tas_audio
    symlink://components/tas_wire
    symlink://components/tas_conn
    symlink://components/tas_status
    symlink://components/tas_led
build_flags = -std=c11 -g -lm -DUNITY_INCLUDE_DOUBLE -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
    '-DTAS_VECTOR_FILE="${PROJECT_DIR}/../docs/protocol/vectors/device.vectors"'
build_src_flags = -Wall -Wextra -Werror
extra_scripts = scripts/sanitize.py
check_src_filters = +<test/>

; The debug build: the same, plus the test hooks (CONFIG_TAS_TEST_HOOKS) for tests by hand and in
; the loop.
[env:m5stack-atom-echo-debug]
extends = env:m5stack-atom-echo
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;boards/m5stack-atom-echo.defaults;debug.defaults
